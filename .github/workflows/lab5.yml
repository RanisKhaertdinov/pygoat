name: Lab 5 DevSecOps

on: [push]

permissions:
  contents: read

jobs:
  sast_scan:
    name: Run Bandit Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit
        run: bandit -ll -ii -r . -f json -o bandit-report.json

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-findings
          path: bandit-report.json
          if-no-files-found: error

  image_scan:
    name: Build and Run Image Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f Dockerfile -t mytestapp:latest .

      - name: Run Docker Scout
        uses: docker/scout-action@v1.15.1
        with:
          dockerhub-user: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_PASSWORD }}
          command: quickview,cves
          image: local://mytestapp:latest
          only-severities: critical,high
          sarif-file: scout-report.sarif
          exit-code: true

      - name: Upload Docker Scout report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-scout-findings
          path: scout-report.sarif
          if-no-files-found: error

  dast_scan:
    name: Run DAST Scan
    runs-on: ubuntu-latest

    steps:
      - name: Start PyGoat
        run: |
          docker pull pygoat/pygoat:latest
          docker run --rm -d --name pygoat -p 8000:8000 pygoat/pygoat:latest
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/ >/dev/null; then
              echo "PyGoat is ready"
              exit 0
            fi
            sleep 2
          done
          echo "PyGoat did not become ready in time"
          docker logs pygoat || true
          exit 1

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: "http://127.0.0.1:8000"
          fail_action: false
          allow_issue_writing: false
          artifact_name: zap-report

      - name: Stop PyGoat
        if: always()
        run: docker stop pygoat || true